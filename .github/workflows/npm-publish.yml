name: Publish npm packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run registry publish (no upload)"
        type: boolean
        default: false

# OIDC trusted publishing requires id-token: write and must NOT use NODE_AUTH_TOKEN.
permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Trust build tooling postinstalls
        run: bun pm trust esbuild @swc/core || true

      # Build first: workspace packages resolve siblings via dist/*.d.ts.
      - name: Build packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Show publish plan
        run: |
          SHARED=$(bun -e "console.log(require('./packages/shared/package.json').version)")
          LLMS=$(bun -e "console.log(require('./packages/core/package.json').version)")
          CLI=$(bun -e "console.log(require('./packages/cli/package.json').version)")
          echo "shared: @caeliq/ccr-shared@$SHARED"
          echo "llms:   @caeliq/llms@$LLMS"
          echo "cli:    @caeliq/claude-code-router@$CLI"
          echo "ref:    $GITHUB_REF"
          echo "bun:    $(bun --version)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/v}
            echo "tag:    v$TAG"
            if [[ "$TAG" != "$CLI" ]]; then
              echo "::warning::Git tag v$TAG does not match CLI package version $CLI. Publish uses package.json versions."
            fi
          fi

      - name: Publish to npm registry (OIDC)
        env:
          CI: "true"
          NPM_TRUSTED_PUBLISHING: "true"
          NPM_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          NODE_AUTH_TOKEN: ""
        run: bash scripts/release.sh npm
