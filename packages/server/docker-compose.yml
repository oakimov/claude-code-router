services:
  ccr:
    build:
      context: ../../
      dockerfile: packages/server/Dockerfile
    image: claude-code-router
    pull_policy: build
    container_name: claude-code-router
    ports:
      - "3456:3456"
      - "1455:3456"
      # Antigravity OAuth: Google redirects to localhost:51121/oauth-callback
      # → CCR Fastify /oauth-callback (same pattern as Codex 1455→3456)
      - "51121:3456"
    volumes:
      - ./ccr-config:/root/.claude-code-router
    networks:
      - ccrnet
    restart: always
    environment:
      - NODE_ENV=production
      - BUN_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SCW_SECRET_KEY=${SCW_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TOGETHERAI_API_KEY=${TOGETHERAI_API_KEY}
      - CODESTRAL_API_KEY=${CODESTRAL_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ALIBABA_API_KEY=${ALIBABA_API_KEY}
      - CURSOR_API_KEY=${CURSOR_API_KEY}
      - NODE_OPTIONS=--dns-result-order=ipv6first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3456/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ccrnet:
    enable_ipv6: true
