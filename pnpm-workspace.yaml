packages:
  - 'packages/*'
  - 'docs'
allowBuilds:
  '@google/genai': true
  '@swc/core': true
  core-js: false
  core-js-pure: false
  esbuild: false
  protobufjs: true
minimumReleaseAgeExclude:
  - tmp@0.2.4 || 0.2.6
  - react-router@7.11.1 || 7.12.0 || 7.12.1 || 7.13.2 || 7.14.0 || 7.14.1 || 7.14.2 || 7.15.0 || 7.18.0
  - undici@6.23.0 || 6.24.0 || 6.27.0 || 7.18.2 || 7.24.0 || 7.28.0
  - diff@4.0.4
  - fastify@5.7.2 || 5.7.3 || 5.8.3 || 5.8.5
  - qs@6.14.1 || 6.14.2 || 6.15.2
  - minimatch@3.1.3 || 3.1.4 || 9.0.6 || 9.0.7
  - rollup@4.59.0
  - serialize-javascript@7.0.3 || 7.0.5
  - ajv@6.14.0 || 8.18.0
  - svgo@3.3.3 || 3.3.4
  - flatted@3.4.0 || 3.4.2
  - path-to-regexp@0.1.13
  - brace-expansion@1.1.13 || 1.1.16 || 2.0.3 || 2.1.2 || 5.0.8
  - node-forge@1.3.4 || 1.4.0
  - picomatch@2.3.2 || 4.0.4
  - dompurify@3.4.13
  - lodash@4.17.23 || 4.17.24
  - vite@7.3.2 || 7.3.5
  - follow-redirects@1.15.12
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - fast-uri@3.1.1 || 3.1.2 || 3.1.3 || 3.1.4
  - webpack-dev-server@5.2.4 || 5.2.5 || 5.2.6
  - ws@7.5.11 || 8.20.1 || 8.21.0
  - uuid@11.1.1
  - '@ai-sdk/provider-utils@3.0.98'
  - '@babel/plugin-transform-modules-systemjs@7.29.4'
  - shell-quote@1.8.4 || 1.8.5
  - joi@17.13.4
  - esbuild@0.28.1
  - launch-editor@2.14.1
  - http-proxy-middleware@2.0.10
  - js-yaml@4.3.1
  - nanoid@3.3.17
  - websocket-driver@0.7.5
  - '@babel/core@7.29.1'
  - adm-zip@0.6.0
  - body-parser@1.20.6
  - find-my-way@9.6.1
  - '@mastra/ai-sdk@1.9.0'
  - '@mastra/core@1.60.0'
peerDependencyRules:
  allowedVersions:
    # Mastra installs Chat SDK for an optional integration this project does
    # not use. Keep the app's AI SDK v5 line for the debug UI.
    'chat@4.38.0>ai': 5.0.112
overrides:
  # Upstream parents are current but cannot reach these maintained children yet.
  # Keep every compatibility/security bridge scoped to the exact dependency edge.
  'sockjs@0.3.24>uuid': ^11.1.0
  'hast-util-raw@9.1.0>@ungap/structured-clone': ^1.3.3
  # gaxios still requests node-fetch 3, whose deprecated dependency chain is
  # unnecessary on the supported Node runtimes; use the native-fetch wrapper.
  # The parent selector stays on the major: a gaxios patch bump silently
  # unmatched the old `7.3.0` pin and let node-fetch 3 (and its deprecated
  # node-domexception chain) back into the tree without pnpm reporting it.
  'gaxios@7>node-fetch': npm:node-fetch-native@^1.6.7
  # @cursor/sdk currently pulls connect-node 1.7 -> undici 5. Connect-node only
  # imports Headers (and only uses it on Node <18), so share core's direct
  # maintained undici 8 line instead of installing a second major.
  '@connectrpc/connect-node@1.7.0>undici': ^8.9.0
  # AI SDK v5 provider-utils uses only undici's stable Agent + fetch surface.
  # Keep its current v3 API while replacing the vulnerable undici 5 line.
  '@ai-sdk/provider-utils@3.0.19>undici': ^8.10.0
  '@ai-sdk/provider-utils@3.0.25>undici': ^8.10.0
  '@ai-sdk/provider-utils@3.0.32>undici': ^8.10.0
  # Consolidate narrow patch/minor splits whose newer releases preserve the
  # APIs used by these exact parents. Keep exact edges so unrelated consumers
  # retain their declared compatibility boundaries.
  '@pnpm/network.ca-file@1.0.2>graceful-fs': 4.2.11
  'sitemap@7.1.3>@types/node': 26.2.0
  'p-retry@4.6.2>@types/retry': 0.12.2
  'serve-handler@6.1.7>bytes': 3.1.2
  'accepts@1.3.8>negotiator': 0.6.4
  'readable-stream@2.3.8>safe-buffer': 5.2.1
  'string_decoder@1.1.1>safe-buffer': 5.2.1
  # @google/genai pins google-auth-library 10 while core depends on 11. The two
  # majors ship a byte-identical build/src — 11.0.0 exists only to raise the
  # Node floor to >=22 (met here) and to take gcp-metadata 9 / logging-utils 2.
  # Sharing core's line collapses all three duplicate pairs at their source.
  '@google/genai@2>google-auth-library': ^11.0.2
  # Docusaurus 3.10.2 is current but its Webpack plugins still pin
  # serialize-javascript 6. Scope the patched major to those exact edges.
  'copy-webpack-plugin@11>serialize-javascript': ^7.0.7
  'css-minimizer-webpack-plugin@5>serialize-javascript': ^7.0.7
  # Monaco 0.56.0 pins DOMPurify 3.4.8; keep the patched 3.4 line local to Monaco.
  'monaco-editor@0.56.0>dompurify': ^3.4.13
  # Docusaurus only needs image-size/fromFile. Replace the archived vulnerable
  # package with a local adapter backed by the maintained probe-image-size parser.
  '@docusaurus/mdx-loader@3.10.2>image-size': link:packages/docusaurus-image-size
  # PostCSS already permits the patched Nano ID release; keep an explicit
  # floor so an existing lockfile cannot retain the vulnerable version.
  'postcss@8.5.25>nanoid': ^3.3.17
  # serve-handler 6.1.7 is current and pins minimatch 3, whose brace-expansion
  # range cannot reach the patched major. Scope the compatibility bridge.
  'minimatch@3.1.5>brace-expansion': ^5.0.8
