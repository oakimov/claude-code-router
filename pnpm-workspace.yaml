overrides:
  # Force deprecated transitive dependency versions up to current, non-deprecated
  # releases. uuid@8.3.2 comes from sockjs (webpack-dev-server, docs toolchain).
  # @ungap/structured-clone@1.3.0 comes from docusaurus's MDX pipeline.
  # node-fetch@^3 pulls in fetch-blob → deprecated node-domexception, replaced
  # with a native-fetch wrapper that has zero dependencies (Node 22+ has native
  # fetch/DOMException). Overrides are avoided where possible — archiver (glob@10)
  # was unused and removed, @fastify/static was upgraded to ^10 (glob@^13).
  uuid: ^11.1.0
  '@ungap/structured-clone': ^1.3.3
  node-fetch: npm:node-fetch-native@^1.6.7
  # Temporary security pins — remove when upstream clears these (see tasks/TODO.md).
  # undici@5.x comes from @cursor/sdk → @connectrpc/connect-node (Headers polyfill
  # unused on Node 22). Scope <6.27 so @caeliq/llms undici@^7 stays untouched.
  undici@<6.27.0: ^6.28.0
  # react-router RSC CSRF (GHSA-qwww-vcr4-c8h2) needs >=8.3.0; react-router-dom
  # is still on the 7.x line. Scope via react-router-dom so Docusaurus (RR 5) is untouched.
  react-router-dom>react-router: 8.3.0
